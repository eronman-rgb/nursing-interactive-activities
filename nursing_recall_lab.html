<div class="app" id="app">

<script>
const $ = s => document.querySelector(s);
const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
let toastTimer;
function toast(message){const t=$('#toast');t.textContent=message;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2100)}
const cards = [
 {q:'What is program development?',a:'The process of planning and organizing activities, resources, and people to achieve specific goals.'},
 {q:'What is program scheduling?',a:'Arranging program activities according to their sequence, duration, and designated time.'},
 {q:'What four questions does planning answer?',a:'What needs to be done, how it will be done, who will do it, and when it will be done.'},
 {q:'What is a goal?',a:'A broad statement describing the desired result or overall purpose of a program.'},
 {q:'What is an objective?',a:'A specific result that a program intends to accomplish within a given period.'},
 {q:'What is a planning formula?',a:'A systematic guide used to organize the important elements needed to accomplish a planned program or activity.'},
 {q:'What does goal-oriented planning mean?',a:'Plans are directed toward achieving specific objectives.'},
 {q:'What does systematic planning involve?',a:'An organized process that includes assessment, identification of needs, resource allocation, implementation, and evaluation.'},
 {q:'What does flexible planning mean?',a:'Plans can be adjusted when patient census, acuity, staffing availability, or institutional needs change.'},
 {q:'What does evidence-based planning rely on?',a:'Reliable information, institutional policies, applicable standards, and patient-care requirements.'},
 {q:'What does efficient planning aim to do?',a:'Use available personnel, time, and resources responsibly to minimize waste and promote quality care.'},
 {q:'What is time management in nursing?',a:'Organizing and allocating available time effectively to accomplish tasks.'},
 {q:'What is clustering care?',a:'Grouping compatible nursing interventions without compromising safety.'},
 {q:'What is delegation?',a:'Assigning appropriate tasks to qualified team members within their scope of practice.'},
 {q:'What is a duty roster?',a:'A tool that lists nurses’ assigned shifts, working days, and days off.'},
 {q:'What does a scheduling calendar display?',a:'Shifts, holidays, approved leave, and training activities.'},
 {q:'What does a staffing worksheet help with?',a:'Calculating staffing requirements and distributing personnel.'},
 {q:'What is a Gantt chart?',a:'A scheduling tool that uses horizontal bars to show activities, their duration, and progress over a specific period.'},
 {q:'What is cyclical scheduling?',a:'A predetermined pattern of workdays, shifts, and days off that repeats over a specified period.'},
 {q:'What is resource allocation?',a:'Assigning available personnel, materials, equipment, money, and time to planned activities.'}
];
const pairs = [
 {term:'Program scheduling',def:'Arranges activities by sequence, duration, and designated time.'},
 {term:'Duty roster',def:'Lists assigned shifts, working days, and days off.'},
 {term:'Scheduling calendar',def:'Displays shifts, holidays, approved leave, and training activities.'},
 {term:'Staffing worksheet',def:'Helps calculate staffing needs and distribute personnel.'},
 {term:'Gantt chart',def:'Uses horizontal bars to show activities, duration, and progress.'},
 {term:'Centralized scheduling',def:'A central authority coordinates schedules for several nursing units.'},
 {term:'Decentralized scheduling',def:'Individual unit managers or head nurses prepare their unit schedules.'},
 {term:'Cyclical scheduling',def:'A repeating pattern of workdays, shifts, and days off.'},
 {term:'Clustering care',def:'Groups compatible nursing interventions without compromising safety.'},
 {term:'Time allocation',def:'Establishes realistic time frames for routine activities.'},
 {term:'Evidence-based planning',def:'Uses reliable information, policies, standards, and patient-care requirements.'},
 {term:'Resource allocation',def:'Assigns personnel, materials, equipment, money, and time to activities.'}
];
const scenarios = [
 {q:'A patient suddenly experiences difficulty breathing while another patient asks for an extra blanket. What should the nurse do first?',opts:['Bring the blanket first','Attend to the patient having difficulty breathing','Finish documentation first','Wait for the next shift'],ans:1,why:'Prioritization means attending to emergencies and urgent patient needs first.'},
 {q:'A head nurse prepares the monthly schedule specifically for the pediatric ward. Which type is this?',opts:['Centralized scheduling','Decentralized scheduling','Cyclical scheduling','Gantt scheduling'],ans:1,why:'Decentralized scheduling is prepared by individual unit managers or head nurses for their own units.'},
 {q:'A hospital nursing service office coordinates schedules for medical, surgical, pediatric, and emergency departments. Which type is used?',opts:['Cyclical scheduling','Decentralized scheduling','Centralized scheduling','Informal scheduling'],ans:2,why:'A central authority coordinating several units is centralized scheduling.'},
 {q:'A unit follows the same four-week pattern of workdays, shifts, and days off. What is this?',opts:['Centralized scheduling','Cyclical scheduling','Decentralized scheduling','Staffing worksheet'],ans:1,why:'Cyclical scheduling repeats a predetermined pattern over a period.'},
 {q:'Two nurses are assigned the same nonurgent task while an essential task is unattended. The manager reorganizes assignments to avoid duplication. Which principle is shown?',opts:['Efficiency','Flexibility','Evidence-based planning','Goal statement'],ans:0,why:'Efficiency means using available time and resources responsibly and avoiding waste or duplication.'},
 {q:'A nurse’s condition changes during the shift. What is the best time-management response?',opts:['Keep the original plan unchanged','Finish routine work before responding','Reassess the patient and revise priorities as needed','Wait until the shift ends'],ans:2,why:'Reassessment means revising priorities when patient conditions change.'},
 {q:'A manager checks patient census, acuity, and hospital policies before deciding staffing levels. Which planning principle is emphasized?',opts:['Evidence-based','Flexible','Goal-oriented','Cyclical'],ans:0,why:'Evidence-based decisions use reliable information, institutional policies, standards, and patient-care requirements.'},
 {q:'Seminar materials are delayed one week before the event. What is the best response?',opts:['Ignore the delay','Reassess priorities, coordinate responsibilities, and adjust the timeline','Remove all objectives','Leave every task without an owner'],ans:1,why:'The case in the material recommends using a clear planning formula, realistic timeline, assigned responsibilities, and tools to monitor progress.'},
 {q:'Which tool would best show activities as horizontal bars across a timeline, including duration and progress?',opts:['Duty roster','Staffing worksheet','Gantt chart','Scheduling calendar'],ans:2,why:'The material defines a Gantt chart as horizontal bars showing activities, duration, and progress over time.'},
 {q:'A nurse manager assigns a procedure to a team member without checking qualification or scope of practice. What is the problem?',opts:['Good delegation','Appropriate clustering','Delegation is not aligned with qualification and scope','Cyclical scheduling'],ans:2,why:'The material says to assign appropriate tasks to qualified personnel within their scope of practice.'}
];
let state={view:'home',cardIndex:0,cardRevealed:false,known:new Set(),reviewed:new Set(),matchRound:[],matchDefs:[],matched:new Set(),leftPick:null,rightPick:null,matchScore:0,scenarioSet:[],scenarioIndex:0,scenarioScore:0,scenarioAnswered:false,sequence:[],sequenceChecked:false,sequenceAttempts:0,completed:new Set()};
function loadProgress(){try{let p=JSON.parse(localStorage.getItem('nurserecall-progress')||'{}');state.known=new Set(p.known||[]);state.completed=new Set(p.completed||[]);state.matchScore=p.matchScore||0;state.scenarioScore=p.scenarioScore||0}catch(e){}}
function saveProgress(){try{localStorage.setItem('nurserecall-progress',JSON.stringify({known:[...state.known],completed:[...state.completed],matchScore:state.matchScore,scenarioScore:state.scenarioScore}))}catch(e){}}
function go(view){state.view=view;render()}
function finishModule(key){state.completed.add(key);saveProgress()}
function home(){const complete=state.completed.size;const recall=state.known.size;return `<section class="hero"><div class="eyebrow">Remember more · understand deeper</div><h1>Learn it. Recall it.<br>Apply it in practice.</h1><p>Turn your nursing-management lesson into short, hands-on activities. Practice key definitions, connect terms to their meanings, and apply the concepts to realistic nursing scenarios.</p><div class="hero-actions"><button class="btn btn-white" onclick="go('flash')">Start recalling&nbsp; →</button><button class="btn" style="background:#ffffff22;color:white;border:1px solid #ffffff55" onclick="go('scenario')">Try scenarios</button></div></section>
<div class="stats"><div class="stat"><div class="stat-icon">🧠</div><div><strong>${recall}<small style="font-size:12px;color:#8e89a5"> / ${cards.length}</small></strong><span>Flashcards recalled</span></div></div><div class="stat"><div class="stat-icon" style="background:#e5f8ec">✓</div><div><strong>${complete}<small style="font-size:12px;color:#8e89a5"> / 4</small></strong><span>Activities completed</span></div></div><div class="stat"><div class="stat-icon" style="background:#fff0df">⚡</div><div><strong>${state.matchScore+state.scenarioScore}</strong><span>Practice points</span></div></div></div>
<div class="section-heading"><div><div class="section-kicker">Choose your activity</div><h2>Recall stations</h2><p>Complete each station in any order. Your progress is saved on this device.</p></div></div>
<div class="modules">
 <article class="module"><div class="module-top"><div class="module-icon tone-purple">▤</div><div class="module-no">STATION 01</div></div><h3>Flashcard Recall</h3><p>Test yourself on key terms before revealing each answer. Mark what you know and repeat the cards that need more practice.</p><div class="module-bottom"><span class="meta">${cards.length} prompts · self-paced</span><button class="mini-btn" onclick="go('flash')">Start cards →</button></div></article>
 <article class="module"><div class="module-top"><div class="module-icon tone-orange">⤳</div><div class="module-no">STATION 02</div></div><h3>Match the Meaning</h3><p>Connect scheduling tools, types, and time-management strategies to their correct descriptions.</p><div class="module-bottom"><span class="meta">8 pairs per round</span><button class="mini-btn" onclick="startMatch()">Play matching →</button></div></article>
 <article class="module"><div class="module-top"><div class="module-icon tone-blue">✚</div><div class="module-no">STATION 03</div></div><h3>Nursing Scenario Lab</h3><p>Apply lesson concepts to priority-setting, staffing, planning principles, delegation, and scheduling situations.</p><div class="module-bottom"><span class="meta">10 situations · feedback</span><button class="mini-btn" onclick="startScenario()">Solve scenarios →</button></div></article>
 <article class="module"><div class="module-top"><div class="module-icon tone-green">☷</div><div class="module-no">STATION 04</div></div><h3>Put Planning in Order</h3><p>Rebuild the systematic planning process from memory, then check the sequence and review the explanation.</p><div class="module-bottom"><span class="meta">5 steps · sequence challenge</span><button class="mini-btn" onclick="startSequence()">Arrange steps →</button></div></article>
</div><div class="section-heading" style="margin-top:28px"><div><div class="section-kicker">Study tip</div><h2>Try to answer before you peek</h2><p>Active recall works best when you retrieve the answer from memory first, then check and correct it.</p></div></div>
<div class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap"><div><strong style="font-size:15px">Want a fresh start?</strong><div style="font-size:12px;color:var(--muted);margin-top:5px">Clear your saved activity progress on this browser.</div></div><button class="btn btn-line" onclick="resetProgress()">Reset progress</button></div>
<div class="source-note">Source basis: uploaded Instructional Material.pdf — intended learning outcomes, definitions, planning principles, time-management strategies, scheduling tools and types, case analysis, and post-test.</div>`}
function backButton(){return `<button class="back" onclick="go('home')">← Back to stations</button>`}
function renderFlash(){const c=cards[state.cardIndex];let isKnown=state.known.has(state.cardIndex);return `${backButton()}<div class="activity-head"><div><div class="section-kicker">Station 01 · Active recall</div><h2>Flashcard Recall</h2><p>Say the answer in your own words before you reveal it.</p></div><div class="counter">CARD ${state.cardIndex+1} / ${cards.length}</div></div><div class="progress-track"><div class="progress-fill" style="width:${(state.cardIndex+1)/cards.length*100}%"></div></div><section class="panel"><div class="flashcard" role="button" tabindex="0" onclick="toggleFlash()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleFlash()}"><div class="label">${state.cardRevealed?'Answer':'Recall prompt'}</div>${state.cardRevealed?`<div class="answer">${escapeHTML(c.a)}</div><div class="flash-hint">Think of a simple example that fits this definition.</div>`:`<div class="prompt">${escapeHTML(c.q)}</div><div class="flash-hint">Click or press Enter to reveal the answer</div>`}</div>${state.cardRevealed?`<div class="row-actions"><button class="btn btn-review" onclick="markCard(false)">↻ Review again</button><button class="btn btn-know" onclick="markCard(true)">✓ I recalled it</button></div>`:`<div class="row-actions"><button class="btn btn-primary" onclick="toggleFlash()">Reveal answer</button></div>`}<div class="recall-count">Confidently recalled <strong>${state.known.size}</strong> of ${cards.length} cards</div><div class="scenario-footer"><button class="btn btn-line" onclick="previousCard()" ${state.cardIndex===0?'disabled':''}>← Previous</button><button class="btn btn-ghost" onclick="nextCard()">${state.cardIndex===cards.length-1?'Finish cards':'Next card →'}</button></div></section><div class="source-note">Reminder: “I recalled it” should mean you could explain the idea without seeing the answer.</div>`}
function toggleFlash(){state.cardRevealed=!state.cardRevealed;render()}
function markCard(known){if(known)state.known.add(state.cardIndex);else state.known.delete(state.cardIndex);state.reviewed.add(state.cardIndex);saveProgress();if(state.cardIndex===cards.length-1){finishModule('flash');state.view='flashdone';}else{state.cardIndex++;state.cardRevealed=false;}render()}
function previousCard(){if(state.cardIndex>0){state.cardIndex--;state.cardRevealed=false;render()}}
function nextCard(){if(state.cardIndex===cards.length-1){finishModule('flash');go('flashdone')}else{state.cardIndex++;state.cardRevealed=false;render()}}
function renderFlashDone(){const pct=Math.round(state.known.size/cards.length*100);return `${backButton()}<section class="panel"><div class="completion"><div class="completion-mark">🧠</div><div class="section-kicker">Station 01 complete</div><h3>Nice work reviewing the key terms!</h3><p>You marked ${state.known.size} of ${cards.length} cards as confidently recalled (${pct}%). For the cards you were unsure about, revisit the Flashcard Recall station and practice again.</p><div class="score-pill">${state.known.size} recalled</div><div class="row-actions"><button class="btn btn-primary" onclick="restartFlash()">Practice cards again</button><button class="btn btn-line" onclick="go('home')">Other activities</button></div></div></section>`}
function restartFlash(){state.cardIndex=0;state.cardRevealed=false;go('flash')}
function startMatch(){state.matchRound=shuffle(pairs).slice(0,8);state.matchDefs=shuffle(state.matchRound);state.matched=new Set();state.leftPick=null;state.rightPick=null;state.matchScore=0;state.view='match';render()}
function chooseMatch(side,id){if(state.matched.has(id))return;if(side==='left')state.leftPick=id;else state.rightPick=id;render();if(state.leftPick&&state.rightPick){const l=state.leftPick,r=state.rightPick;if(l===r){state.matched.add(l);state.matchScore+=10;state.leftPick=null;state.rightPick=null;if(state.matched.size===state.matchRound.length){finishModule('match');saveProgress();state.view='matchdone';}render();}else{const m=$('#matchFeedback');if(m){m.className='feedback bad';m.textContent='Not a match yet. Think about what each tool or term is used for, then try again.'}const left=$(`[data-left="${l}"]`),right=$(`[data-right="${r}"]`);if(left)left.classList.add('wrong');if(right)right.classList.add('wrong');setTimeout(()=>{state.leftPick=null;state.rightPick=null;render()},800)}}}
function renderMatch(){const left=state.matchRound,done=state.matched.size,total=left.length;return `${backButton()}<div class="activity-head"><div><div class="section-kicker">Station 02 · Connect the concepts</div><h2>Match the Meaning</h2><p>Choose a term on the left, then choose its definition on the right.</p></div><div class="counter">${done} / ${total} MATCHED</div></div><div class="progress-track"><div class="progress-fill" style="width:${done/total*100}%"></div></div><section class="panel"><div class="match-layout"><div class="match-col"><div class="match-title">Term or tool</div>${left.map(p=>`<button class="match-card ${state.matched.has(p.term)?'matched':''} ${state.leftPick===p.term?'selected':''}" data-left="${escapeHTML(p.term)}" onclick='chooseMatch("left",${JSON.stringify(p.term).replace(/</g,'\\u003c')})' ${state.matched.has(p.term)?'disabled':''}>${state.matched.has(p.term)?'✓ ':''}${escapeHTML(p.term)}</button>`).join('')}</div><div class="match-col"><div class="match-title">Description</div>${state.matchDefs.map(p=>`<button class="match-card ${state.matched.has(p.term)?'matched':''} ${state.rightPick===p.term?'selected':''}" data-right="${escapeHTML(p.term)}" onclick='chooseMatch("right",${JSON.stringify(p.term).replace(/</g,'\\u003c')})' ${state.matched.has(p.term)?'disabled':''}>${state.matched.has(p.term)?'✓ ':''}${escapeHTML(p.def)}</button>`).join('')}</div></div><div id="matchFeedback" class="feedback ${done?'good':''}">${done?`Correct matches earn 10 points each. You have ${state.matchScore} points.`:'Tip: Identify the tool’s specific purpose or the defining feature of the scheduling type.'}</div><div class="scenario-footer"><span class="meta">Correct match = 10 points</span><button class="btn btn-line" onclick="startMatch()">Shuffle and restart</button></div></section>`}
function renderMatchDone(){return `${backButton()}<section class="panel"><div class="completion"><div class="completion-mark">🔗</div><div class="section-kicker">Station 02 complete</div><h3>Every concept connected!</h3><p>You matched all ${state.matchRound.length} pairs. Reviewing the descriptions aloud can help strengthen recall.</p><div class="score-pill">${state.matchScore} points</div><div class="row-actions"><button class="btn btn-primary" onclick="startMatch()">Play a new round</button><button class="btn btn-line" onclick="go('home')">Other activities</button></div></div></section>`}
function startScenario(){state.scenarioSet=shuffle(scenarios);state.scenarioIndex=0;state.scenarioScore=0;state.scenarioAnswered=false;state.view='scenario';render()}
function answerScenario(i){if(state.scenarioAnswered)return;const q=state.scenarioSet[state.scenarioIndex];state.scenarioAnswered=true;if(i===q.ans)state.scenarioScore+=10;render()}
function nextScenario(){if(state.scenarioIndex>=state.scenarioSet.length-1){finishModule('scenario');saveProgress();go('scenariodone')}else{state.scenarioIndex++;state.scenarioAnswered=false;render()}}
function renderScenario(){const q=state.scenarioSet[state.scenarioIndex],answered=state.scenarioAnswered;return `${backButton()}<div class="activity-head"><div><div class="section-kicker">Station 03 · Apply the lesson</div><h2>Nursing Scenario Lab</h2><p>Choose the best response or concept, then read the reason.</p></div><div class="counter">${state.scenarioIndex+1} / ${state.scenarioSet.length}</div></div><div class="progress-track"><div class="progress-fill" style="width:${(state.scenarioIndex+1)/state.scenarioSet.length*100}%"></div></div><section class="panel"><div class="question-box"><div class="label">Situation ${state.scenarioIndex+1}</div><h3>${escapeHTML(q.q)}</h3></div><div class="choices">${q.opts.map((o,i)=>`<button class="choice ${answered&&i===q.ans?'correct':''} ${answered&&i!==q.ans&&i===state._lastAnswer?'incorrect':''}" onclick="answerScenario(${i})" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${escapeHTML(o)}</span></button>`).join('')}</div>${answered?`<div class="feedback ${state._lastAnswer===q.ans?'good':'bad'}"><strong>${state._lastAnswer===q.ans?'Correct!':'Review this concept.'}</strong> ${escapeHTML(q.why)}</div>`:''}<div class="scenario-footer"><span class="meta">Score: ${state.scenarioScore} points</span>${answered?`<button class="btn btn-primary" onclick="nextScenario()">${state.scenarioIndex===state.scenarioSet.length-1?'See results':'Next situation →'}</button>`:`<span class="meta">Correct answer = 10 points</span>`}</div></section>`}
// Store selected choice before rendering feedback.
const originalAnswerScenario=answerScenario;
answerScenario=function(i){if(state.scenarioAnswered)return;state._lastAnswer=i;originalAnswerScenario(i)};
function renderScenarioDone(){const total=state.scenarioSet.length*10;return `${backButton()}<section class="panel"><div class="completion"><div class="completion-mark">🩺</div><div class="section-kicker">Station 03 complete</div><h3>Scenario review finished</h3><p>You earned ${state.scenarioScore} out of ${total} points. Read the explanations for missed items and identify which lesson principle you should revisit.</p><div class="score-pill">${state.scenarioScore} / ${total} points</div><div class="row-actions"><button class="btn btn-primary" onclick="startScenario()">Try another round</button><button class="btn btn-line" onclick="go('home')">Other activities</button></div></div></section>`}
const steps=[
 {id:'assessment',text:'Assess the current situation and needs.'},
 {id:'needs',text:'Identify the needs and priorities.'},
 {id:'resources',text:'Allocate available resources.'},
 {id:'implementation',text:'Implement the plan.'},
 {id:'evaluation',text:'Evaluate the results.'}
];
function startSequence(){state.sequence=shuffle(steps);state.sequenceChecked=false;state.sequenceAttempts=0;state.view='sequence';render()}
function moveStep(i,delta){const j=i+delta;if(j<0||j>=state.sequence.length||state.sequenceChecked)return;[state.sequence[i],state.sequence[j]]=[state.sequence[j],state.sequence[i]];render()}
function checkSequence(){state.sequenceChecked=true;state.sequenceAttempts++;finishModule('sequence');saveProgress();render()}
function renderSequence(){const correct=state.sequence.every((s,i)=>s.id===steps[i].id);return `${backButton()}<div class="activity-head"><div><div class="section-kicker">Station 04 · Rebuild the process</div><h2>Put Planning in Order</h2><p>Arrange the systematic planning process from beginning to end.</p></div><div class="counter">5 STEPS</div></div><div class="progress-track"><div class="progress-fill" style="width:${state.sequenceChecked?100:35}%"></div></div><section class="panel"><div class="label">Your sequence</div><div class="sequence-list">${state.sequence.map((s,i)=>`<div class="sequence-item" style="${state.sequenceChecked?(s.id===steps[i].id?'border-color:#9bd9b5;background:#f2fbf5':'border-color:#efa3b1;background:#fff6f7'):''}"><span class="sequence-number">${i+1}</span><span>${escapeHTML(s.text)}</span><div class="move-buttons"><button aria-label="Move up" onclick="moveStep(${i},-1)" ${i===0||state.sequenceChecked?'disabled':''}>↑</button><button aria-label="Move down" onclick="moveStep(${i},1)" ${i===state.sequence.length-1||state.sequenceChecked?'disabled':''}>↓</button></div></div>`).join('')}</div>${state.sequenceChecked?`<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'Correct sequence!':'Almost — compare with the lesson sequence.'}</strong><br>${correct?'You recalled the systematic process in the correct order.':'The order is: assessment → identification of needs → resource allocation → implementation → evaluation. Review the order and try again.'}</div>`:''}<div class="scenario-footer"><span class="meta">Based on the lesson’s principles of systematic planning</span>${state.sequenceChecked?`<button class="btn btn-primary" onclick="startSequence()">Try again</button>`:`<button class="btn btn-primary" onclick="checkSequence()">Check sequence</button>`}</div></section><div class="source-note">Use the up and down arrows to reorder the steps. This sequence follows the systematic planning process described in the instructional material.</div>`}
function resetProgress(){if(confirm('Clear saved flashcard recall and activity completion from this browser?')){state.known.clear();state.completed.clear();state.matchScore=0;state.scenarioScore=0;state.cardIndex=0;state.cardRevealed=false;try{localStorage.removeItem('nurserecall-progress')}catch(e){}go('home');toast('Your progress has been reset.')}}
function render(){const main=$('#main');switch(state.view){case'home':main.innerHTML=home();break;case'flash':main.innerHTML=renderFlash();break;case'flashdone':main.innerHTML=renderFlashDone();break;case'match':main.innerHTML=renderMatch();break;case'matchdone':main.innerHTML=renderMatchDone();break;case'scenario':main.innerHTML=renderScenario();break;case'scenariodone':main.innerHTML=renderScenarioDone();break;case'sequence':main.innerHTML=renderSequence();break;default:main.innerHTML=home()}}
loadProgress();render();
</script>
</body>
</html>
